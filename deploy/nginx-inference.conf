# /etc/nginx/sites-available/inference.opencrabs.com
# Fronts keyproxy (127.0.0.1:8787). This is the host OpenCrabs points
# a custom provider base_url at: https://inference.opencrabs.com/v1

server {
    listen 80;
    server_name inference.opencrabs.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name inference.opencrabs.com;

    # Issue with: certbot --nginx -d inference.opencrabs.com
    ssl_certificate     /etc/letsencrypt/live/inference.opencrabs.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/inference.opencrabs.com/privkey.pem;

    # Generous body for long prompts.
    client_max_body_size 25m;

    location / {
        proxy_pass http://127.0.0.1:8787;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        # The proxy reads the last X-Forwarded-For entry (added by this hop) for rate limits.
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Streaming (SSE) must pass through unbuffered, and chat completions can
        # be long-lived; bump the timeouts.
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
        chunked_transfer_encoding on;
    }
}
